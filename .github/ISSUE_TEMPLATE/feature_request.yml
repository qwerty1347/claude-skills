name: 스킬 제안
description: 새 스킬을 만들거나 기존 스킬을 확장하고 싶을 때
labels: ["enhancement"]
body:
  - type: textarea
    id: repetition
    attributes:
      label: 어떤 작업을 반복하고 있나
      description: 스킬은 반복을 굳히는 것입니다. 반복이 아니면 스킬이 아닙니다.
    validations:
      required: true

  - type: dropdown
    id: count
    attributes:
      label: 몇 번 반복했나
      options:
        - 3회 이상 (스킬로 만들 만하다)
        - 2회 (한 번 더 해보고 판단)
        - 1회 (아직 만들지 말 것)
    validations:
      required: true

  - type: textarea
    id: prompts
    attributes:
      label: 지금은 매번 어떻게 지시하나
      description: 실제로 쳤던 문장을 그대로. 그대로 description 의 트리거가 됩니다.
      render: text
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: 결과물이 어떤 모양이면 성공인가
      description: 눈으로 바로 판정할 수 있어야 합니다. 판정 기준이 없으면 개선도 못 합니다.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 새 스킬인가, 기존 스킬 확장인가
      options:
        - 새 스킬
        - 기존 스킬 확장
        - 모르겠음
    validations:
      required: true
